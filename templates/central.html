<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>CONDO-SAFE24 - Painel Central</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#ff6a00">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/icons/icon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- TODO O CSS ORIGINAL MANTIDO -->
</head>

<body>
<!-- TODO O HTML ORIGINAL MANTIDO -->

<script>
async function fetchStatus() {
    const resp = await fetch('/api/status');
    return await resp.json();
}

function renderAlerts(alerts) {
    const tbody = document.getElementById('alertsBody');
    tbody.innerHTML = '';
    if (!alerts || alerts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px; color:#94a3b8;">Nenhum alerta recebido ainda...</td></tr>';
        return;
    }
    alerts.forEach((a, idx) => {
        const tr = document.createElement('tr');
        const gpsLink = (a.lat && a.lng)
            ? `<a href="https://www.google.com/maps?q=${a.lat},${a.lng}" target="_blank">Abrir mapa</a>`
            : '—';
        tr.innerHTML = `
            <td>${idx + 1}</td>
            <td>${a.caller || '—'}</td>
            <td>${a.type || '—'}</td>
            <td>${a.description || '—'}</td>
            <td>${a.ts || '—'}</td>
            <td>${a.resolved ? 'Resolvido' : 'Ativo'}</td>
            <td>${gpsLink}</td>
        `;
        tbody.appendChild(tr);
    });
}

function updateVisualState(hasActive) {
    const sphere = document.getElementById('sphere');
    if (hasActive) {
        sphere.textContent = "ALERTA";
        sphere.classList.add('sphere-alert');
    } else {
        sphere.textContent = "NORMAL";
        sphere.classList.remove('sphere-alert');
    }
}

function updateSirenUI(sirenOn, muted, alerts) {
    const sirenStatus = document.getElementById('sirenStatus');
    const audio = document.getElementById('sirenAudio');
    const hasActive = alerts && alerts.some(a => !a.resolved);

    // ✅ CORREÇÃO APLICADA AQUI
    updateVisualState(hasActive);

    if (sirenOn && !muted) {
        sirenStatus.innerHTML = 'Status da Sirene: <b style="color:#ff4757;">🚨 ATIVA</b>';
        if (audio.paused) {
            audio.currentTime = 0;
            audio.play().catch(()=>{});
        }
    } else if (sirenOn && muted) {
        sirenStatus.innerHTML = 'Status da Sirene: <b style="color:#ffa502;">Ativa (Mudo)</b>';
        audio.pause();
        audio.currentTime = 0;
    } else {
        sirenStatus.innerHTML = 'Status da Sirene: <b style="color:#00ffcc;">Desligada</b>';
        audio.pause();
        audio.currentTime = 0;
    }
}

async function atualizar() {
    try {
        const data = await fetchStatus();
        renderAlerts(data.alerts);
        updateSirenUI(data.siren, data.muted, data.alerts || []);
    } catch(e) {
        console.error(e);
    }
}

setInterval(atualizar, 5000);
atualizar();
</script>
</body>
</html>
