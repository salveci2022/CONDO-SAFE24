<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONDO-SAFE24 — Analytics</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--blue:#0066ff;--orange:#ff6a00;--cyan:#00ffcc;--green:#00d084;--red:#ff4757;
  --black:#0a0f1a;--dark:#131a2a;--card:#0f1826;--text:#f1f5f9;--muted:#94a3b8;--border:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--black);color:var(--text);min-height:100vh}
nav{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;
  background:rgba(10,15,26,.9);border-bottom:1px solid var(--border);backdrop-filter:blur(20px);
  position:sticky;top:0;z-index:100}
.brand{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav-links a{color:var(--muted);text-decoration:none;font-size:14px;margin-left:24px;transition:color .2s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--cyan)}
.main{max-width:1200px;margin:0 auto;padding:32px 24px}
.page-title{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;margin-bottom:6px}
.page-sub{color:var(--muted);font-size:14px;margin-bottom:32px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;position:relative;overflow:hidden}
.stat-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px}
.stat-card.s-blue::before{background:var(--blue)}
.stat-card.s-red::before{background:var(--red)}
.stat-card.s-green::before{background:var(--green)}
.stat-card.s-orange::before{background:var(--orange)}
.stat-label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px}
.stat-num{font-family:'Syne',sans-serif;font-size:2.4rem;font-weight:800;line-height:1}
.stat-num.c-blue{color:var(--blue)}.stat-num.c-red{color:var(--red)}
.stat-num.c-green{color:var(--green)}.stat-num.c-orange{color:var(--orange)}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px}
.chart-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;margin-bottom:20px;
  display:flex;align-items:center;justify-content:space-between}
.chart-wrap{position:relative;height:240px}
.export-bar{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.btn-export{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:10px;
  border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);
  font-size:14px;text-decoration:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.btn-export:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.btn-export.primary{background:linear-gradient(135deg,var(--blue),rgba(123,66,246,.8));border:0;
  box-shadow:0 6px 20px rgba(0,102,255,.3)}
.btn-export.primary:hover{box-shadow:0 10px 28px rgba(0,102,255,.5)}
.refresh-info{font-size:13px;color:var(--muted);margin-left:auto;align-self:center}
@media(max-width:768px){.stats-grid{grid-template-columns:1fr 1fr}.charts-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
  <div class="brand">CONDO-SAFE24</div>
  <div class="nav-links">
    <a href="/central">Central</a>
    <a href="/analytics" class="active">Analytics</a>
    <a href="/report.pdf" target="_blank">PDF</a>
    <a href="/export.xlsx">Excel</a>
    <a href="/painel_publico">Painel</a>
  </div>
</nav>
<div class="main">
  <div class="page-title">📊 Analytics & Relatórios</div>
  <div class="page-sub" id="ultima-atualizacao">Carregando dados...</div>

  <div class="export-bar">
    <a href="/export.xlsx" class="btn-export primary">📥 Exportar Excel</a>
    <a href="/report.pdf" target="_blank" class="btn-export">📄 Relatório PDF</a>
    <button class="btn-export" onclick="carregarDados()">🔄 Atualizar</button>
    <span class="refresh-info" id="refresh-info"></span>
  </div>

  <div class="stats-grid">
    <div class="stat-card s-blue"><div class="stat-label">Total de Alertas</div><div class="stat-num c-blue" id="s-total">—</div></div>
    <div class="stat-card s-red"><div class="stat-label">Alertas Ativos</div><div class="stat-num c-red" id="s-ativos">—</div></div>
    <div class="stat-card s-green"><div class="stat-label">Resolvidos</div><div class="stat-num c-green" id="s-resolvidos">—</div></div>
    <div class="stat-card s-orange"><div class="stat-label">Taxa de Resolução</div><div class="stat-num c-orange" id="s-taxa">—</div></div>
  </div>

  <div class="charts-grid">
    <div class="chart-card">
      <div class="chart-title">Alertas por Tipo <span style="font-size:12px;color:var(--muted);font-weight:400">Top categorias</span></div>
      <div class="chart-wrap"><canvas id="chart-tipo"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Alertas por Hora do Dia <span style="font-size:12px;color:var(--muted);font-weight:400">Distribuição 24h</span></div>
      <div class="chart-wrap"><canvas id="chart-hora"></canvas></div>
    </div>
  </div>
</div>

<script>
const CORES = ['#0066ff','#ff6a00','#00ffcc','#ff4757','#7b42f6','#00d084','#ffd32a','#ff6b81'];
let chartTipo = null, chartHora = null;

Chart.defaults.color = '#94a3b8';
Chart.defaults.borderColor = 'rgba(255,255,255,0.06)';
Chart.defaults.font.family = 'DM Sans';

async function carregarDados() {
  try {
    const r = await fetch('/api/analytics');
    const d = await r.json();
    if (!d.ok) return;
    const s = d.stats;
    document.getElementById('s-total').textContent = s.total;
    document.getElementById('s-ativos').textContent = s.ativos;
    document.getElementById('s-resolvidos').textContent = s.resolvidos;
    const taxa = s.total > 0 ? Math.round(s.resolvidos / s.total * 100) : 0;
    document.getElementById('s-taxa').textContent = taxa + '%';
    document.getElementById('ultima-atualizacao').textContent =
      'Última atualização: ' + new Date().toLocaleString('pt-BR');
    renderChartTipo(s.por_tipo || []);
    renderChartHora(s.por_hora || []);
  } catch(e) { console.error(e); }
}

function renderChartTipo(dados) {
  const labels = dados.map(d => d.type || 'Sem tipo');
  const values = dados.map(d => d.n);
  if (chartTipo) chartTipo.destroy();
  chartTipo = new Chart(document.getElementById('chart-tipo'), {
    type: 'doughnut',
    data: { labels, datasets: [{ data: values, backgroundColor: CORES, borderWidth: 2, borderColor: '#0f1826' }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'right', labels: { boxWidth: 12, padding: 12, font: { size: 12 } } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed} alertas` } }
      }
    }
  });
}

function renderChartHora(dados) {
  const horas = Array.from({length:24}, (_,i) => String(i).padStart(2,'0'));
  const mapa = {};
  dados.forEach(d => { mapa[d.h] = d.n; });
  const values = horas.map(h => mapa[h] || 0);
  if (chartHora) chartHora.destroy();
  chartHora = new Chart(document.getElementById('chart-hora'), {
    type: 'bar',
    data: {
      labels: horas.map(h => h + 'h'),
      datasets: [{
        label: 'Alertas', data: values,
        backgroundColor: 'rgba(0,102,255,0.6)',
        borderColor: '#0066ff', borderWidth: 1, borderRadius: 4,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { font: { size: 11 } } },
        y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { stepSize: 1 }, beginAtZero: true }
      }
    }
  });
}

carregarDados();
setInterval(carregarDados, 30000);
</script>
</body>
</html>
