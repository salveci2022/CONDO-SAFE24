<!DOCTYPE html>
<html lang="pt-br">
<head>

  <style>
    body{font-family:Arial,sans-serif;background:#0a0f1a;color:#f1f5f9;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
    .card{background:#131a2a;border:1px solid rgba(148,163,184,.22);border-radius:16px;padding:22px;max-width:420px;width:92%}
    h1{margin:0 0 8px;font-size:22px}
    p{margin:0 0 14px;color:#cbd5e1;font-size:13px}
    input{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(148,163,184,.25);background:#0a0f1a;color:#fff;outline:none}
    button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;font-weight:800;cursor:pointer;background:#ff6a00;color:#0b1020}
    .err{margin-top:10px;color:#fecaca;font-size:13px}
  </style>

<body>
  <div class="card">
    <h1>🔒 Painel Administrativo — CONDO-SAFE24</h1>
    <p>Acesso restrito. SpyNet Tecnologia Forense.</p>
    <form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <input name="senha" type="password" placeholder="Senha do Admin" required>
      <button type="submit">Entrar</button>
